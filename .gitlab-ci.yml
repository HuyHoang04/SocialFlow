stages:
  - build
  - deploy

variables:
  REGISTRY: ${CI_REGISTRY}
  IMAGE_TAG: ${CI_COMMIT_SHA:0:8}
  BACKEND_IMAGE: ${CI_REGISTRY_IMAGE}/backend
  FRONTEND_IMAGE: ${CI_REGISTRY_IMAGE}/frontend

build_backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd backend
    - docker build -t $BACKEND_IMAGE:latest -t $BACKEND_IMAGE:$IMAGE_TAG .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $BACKEND_IMAGE:latest
    - docker push $BACKEND_IMAGE:$IMAGE_TAG

build_frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd frontend
    - docker build -t $FRONTEND_IMAGE:latest -t $FRONTEND_IMAGE:$IMAGE_TAG .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $FRONTEND_IMAGE:latest
    - docker push $FRONTEND_IMAGE:$IMAGE_TAG

deploy_production:
  stage: deploy
  image: alpine:3.20
  needs: ["build_backend", "build_frontend"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client bash coreutils
    - test -n "$EC2_HOST"
    - test -n "$EC2_USER"
    - test -n "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - export SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6"
  script:
    - |
      echo "[CI] Copying manifests to EC2..."
      timeout 180s scp $SSH_OPTS -i ~/.ssh/id_rsa -r k8s "$EC2_USER@$EC2_HOST:/tmp/socialflow-k8s"

      echo "[CI] Connecting to EC2 and deploying..."
      timeout 900s ssh $SSH_OPTS -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" '
        set -euxo pipefail

        sudo -n true

        # Copy manifests and apply directly
        sudo -n rm -rf /opt/socialflow/k8s 2>/dev/null || true
        sudo -n mkdir -p /opt/socialflow
        sudo -n mv /tmp/socialflow-k8s /opt/socialflow/k8s

        # Apply manifests in phases
        echo "Phase 1: Creating namespace..."
        for i in 1 2 3 4 5; do
          if sudo -n k3s kubectl apply --validate=false --request-timeout=300s -f /opt/socialflow/k8s/01-namespace.yaml 2>/dev/null; then
            echo "✓ Namespace created"
            break
          fi
          if [ $i -lt 5 ]; then
            echo "Retry $i/5: waiting for K3s API..."
            sleep 10
          fi
        done

        sleep 5

        echo "Phase 2-4: Applying all remaining manifests..."
        for manifest in /opt/socialflow/k8s/*.yaml; do
          [ "$manifest" = "/opt/socialflow/k8s/01-namespace.yaml" ] && continue
          sudo -n k3s kubectl apply --validate=false --request-timeout=300s -f "$manifest" 2>/dev/null || true
          sleep 1
        done

        echo ""
        echo "Deployment status:"
        sleep 3
        sudo -n k3s kubectl get pods -n socialflow -o wide
        echo ""
        sudo -n k3s kubectl get svc -n socialflow
      '
  environment:
    name: production
