stages:
  - deploy

default:
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client bash
    - test -n "$EC2_HOST"
    - test -n "$EC2_USER"
    - test -n "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - export SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"

deploy_production:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      scp $SSH_OPTS -i ~/.ssh/id_rsa -r k8s "$EC2_USER@$EC2_HOST:/tmp/socialflow-k8s"
      ssh $SSH_OPTS -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" '
        set -e

        # Wait until k3s API server is ready before applying manifests
        for i in $(seq 1 30); do
          if sudo k3s kubectl get --raw=/readyz >/dev/null 2>&1; then
            echo "k3s API is ready"
            break
          fi
          echo "waiting for k3s API... ($i/30)"
          sleep 5
        done
        sudo k3s kubectl get --raw=/readyz >/dev/null

        sudo rm -rf /opt/socialflow/k8s
        sudo mkdir -p /opt/socialflow
        sudo mv /tmp/socialflow-k8s /opt/socialflow/k8s

        # Avoid intermittent OpenAPI download timeout on small nodes
        sudo k3s kubectl apply --validate=false --request-timeout=120s -f /opt/socialflow/k8s/
        sudo k3s kubectl get pods -n socialflow -o wide
        sudo k3s kubectl get svc -n socialflow
      '
  environment:
    name: production
