stages:
  - build
  - deploy

variables:
  ECR_REGISTRY: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

.build_template: &build_template
  stage: build
  image: docker:25-dind
  services:
    - docker:25-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin "$ECR_REGISTRY"

build_backend:
  <<: *build_template
  script:
    - docker build -t "$ECR_REGISTRY/socialflow/backend:latest" ./backend/
    - docker push "$ECR_REGISTRY/socialflow/backend:latest"

build_frontend:
  <<: *build_template
  script:
    - >
      docker build 
      --build-arg NEXT_PUBLIC_API_URL=https://socialflow.io.vn 
      --build-arg NEXT_PUBLIC_FACEBOOK_APP_ID=$FACEBOOK_APP_ID 
      --build-arg NEXT_PUBLIC_UNSPLASH_APP_ID=$UNSPLASH_APP_ID 
      --build-arg NEXT_PUBLIC_UNSPLASH_ACCESS_KEY=$UNSPLASH_ACCESS_KEY 
      -t "$ECR_REGISTRY/socialflow/frontend:latest" ./frontend/
    - docker push "$ECR_REGISTRY/socialflow/frontend:latest"

build_ai_service:
  <<: *build_template
  script:
    - docker build -t "$ECR_REGISTRY/socialflow/ai_service:latest" ./ai-service/
    - docker push "$ECR_REGISTRY/socialflow/ai_service:latest"

deploy_production:
  stage: deploy
  image: alpine:3.20
  needs:
    - build_backend
    - build_frontend
    - build_ai_service
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client bash coreutils git
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - export SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"
  script:
    - |
      echo "[CI] Preparing .env file for Docker Compose..."
      cat <<EOF > .env
      AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}
      AWS_REGION=${AWS_REGION}
      SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET=${JWT_SECRET}
      GROQ_API_KEY=${GROQ_API_KEY}
      OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      PIXAZO_API_KEY=${PIXAZO_API_KEY}
      FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID}
      FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET}
      UNSPLASH_APP_ID=${UNSPLASH_APP_ID}
      UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY}
      UNSPLASH_SECRET_KEY=${UNSPLASH_SECRET_KEY}
      RAPIDAPI_KEY=${RAPIDAPI_KEY}
      SERPAPI_KEY=${SERPAPI_KEY}
      LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      NEXT_PUBLIC_API_URL=https://socialflow.io.vn
      EOF

      echo "[CI] Copying Docker Compose files to EC2..."
      scp $SSH_OPTS -i ~/.ssh/id_rsa docker-compose.yml nginx.conf .env "$EC2_USER@$EC2_HOST:/home/ubuntu/socialflow/"

      echo "[CI] Executing remote deployment with Docker Compose..."
      ssh $SSH_OPTS -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "
        set -euxo pipefail
        cd /home/ubuntu/socialflow
        
        # Login to ECR
        aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}
        
        # Stop and remove old containers to save RAM
        docker compose down || true
        
        # Pull and Start
        docker compose pull
        docker compose up -d
        
        echo '✓ Deployment successful with Docker Compose!'
      "
  environment:
    name: production
