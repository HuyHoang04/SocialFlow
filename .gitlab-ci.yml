stages:
  - build
  - deploy

variables:
  # Registry URL se duoc build tu cac bien moi truong trong GitLab Settings
  ECR_REGISTRY: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

# ─────────────────────────────────────────────
# STAGE 1: BUILD — Build va push images len ECR
# ─────────────────────────────────────────────
.build_template: &build_template
  stage: build
  image: docker:25-dind
  services:
    - docker:25-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    # Dung Docker de chay AWS CLI chinh chu, tranh loi thu vien tren Alpine
    - |
      docker run --rm \
        -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
        -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
        -e AWS_DEFAULT_REGION=$AWS_REGION \
        amazon/aws-cli ecr get-login-password --region $AWS_REGION \
        | docker login --username AWS --password-stdin "$ECR_REGISTRY"

build_backend:
  <<: *build_template
  script:
    - docker build -t "$ECR_REGISTRY/socialflow/backend:latest" ./backend/
    - docker push "$ECR_REGISTRY/socialflow/backend:latest"

build_frontend:
  <<: *build_template
  script:
    - docker build -t "$ECR_REGISTRY/socialflow/frontend:latest" ./frontend/
    - docker push "$ECR_REGISTRY/socialflow/frontend:latest"

build_ai_service:
  <<: *build_template
  script:
    - docker build -t "$ECR_REGISTRY/socialflow/ai_service:latest" ./ai-service/
    - docker push "$ECR_REGISTRY/socialflow/ai_service:latest"

# ─────────────────────────────────────────────
# STAGE 2: DEPLOY — Chi gui lenh cap nhat len EC2
# ─────────────────────────────────────────────
deploy_production:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client bash coreutils git
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - export SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"
  script:
    - |
      echo "[CI] Updating K8s manifests with ECR URLs..."
      # Dung sed de thay the Account ID va Region vao manifest truoc khi gui di
      sed -i "s|<ACCOUNT_ID>|${AWS_ACCOUNT_ID}|g" k8s/*.yaml
      sed -i "s|<REGION>|${AWS_REGION}|g" k8s/*.yaml

      echo "[CI] Copying manifests to EC2..."
      scp $SSH_OPTS -i ~/.ssh/id_rsa -r k8s "$EC2_USER@$EC2_HOST:/tmp/socialflow-k8s"

      echo "[CI] Executing remote deployment..."
      ssh $SSH_OPTS -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "
        set -euxo pipefail
        
        # Dang nhap ECR ngay tren EC2 de K3s co quyen keo anh
        ECR_PASS=\$(aws ecr get-login-password --region ${AWS_REGION})
        echo \$ECR_PASS | sudo -n k3s ctr images pull --user AWS:\$ECR_PASS ${ECR_REGISTRY}/socialflow/backend:latest || true

        # Cap nhat folder manifest
        sudo -n rm -rf /opt/socialflow/k8s
        sudo -n mkdir -p /opt/socialflow
        sudo -n mv /tmp/socialflow-k8s /opt/socialflow/k8s

        # Apply K8s
        sudo -n k3s kubectl apply -f /opt/socialflow/k8s/01-namespace.yaml
        for manifest in /opt/socialflow/k8s/*.yaml; do
          [ \"\$manifest\" = '/opt/socialflow/k8s/01-namespace.yaml' ] && continue
          sudo -n k3s kubectl apply -f \"\$manifest\"
        done

        # Force restart de pod lay anh moi nhat tu ECR
        sudo -n k3s kubectl rollout restart deployment/backend -n socialflow
        sudo -n k3s kubectl rollout restart deployment/frontend -n socialflow
        sudo -n k3s kubectl rollout restart deployment/ai-service -n socialflow
        
        echo '✓ Deployment successful!'
      "
  environment:
    name: production
