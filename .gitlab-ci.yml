stages:
  - build
  - deploy

variables:
  DEPLOY_TARGET: "compose" # Thay đổi thành "k8s" nếu bạn muốn dùng Kubernetes
  ECR_REGISTRY: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

.build_template: &build_template
  stage: build
  image: docker:25-dind
  services:
    - docker:25-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - |
      AWS_TOKEN=$(docker run --rm \
        -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
        -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
        -e AWS_DEFAULT_REGION=$AWS_REGION \
        amazon/aws-cli ecr get-login-password --region $AWS_REGION)
      echo "$AWS_TOKEN" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

build_backend:
  <<: *build_template
  script:
    - docker build -t "$ECR_REGISTRY/socialflow/backend:latest" ./backend/
    - docker push "$ECR_REGISTRY/socialflow/backend:latest"

build_frontend:
  <<: *build_template
  script:
    - >
      docker build 
      --build-arg NEXT_PUBLIC_API_URL=https://socialflow.io.vn 
      --build-arg NEXT_PUBLIC_FACEBOOK_APP_ID=$FACEBOOK_APP_ID 
      --build-arg NEXT_PUBLIC_UNSPLASH_APP_ID=$UNSPLASH_APP_ID 
      --build-arg NEXT_PUBLIC_UNSPLASH_ACCESS_KEY=$UNSPLASH_ACCESS_KEY 
      -t "$ECR_REGISTRY/socialflow/frontend:latest" ./frontend/
    - docker push "$ECR_REGISTRY/socialflow/frontend:latest"

build_ai_service:
  <<: *build_template
  script:
    - docker build -t "$ECR_REGISTRY/socialflow/ai_service:latest" ./ai-service/
    - docker push "$ECR_REGISTRY/socialflow/ai_service:latest"

deploy_production:
  stage: deploy
  image: alpine:3.20
  needs:
    - build_backend
    - build_frontend
    - build_ai_service
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client bash coreutils git aws-cli
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - export SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"
  script:
    - |
      echo "[CI] Deploy Target is $DEPLOY_TARGET"
      echo "[CI] Preparing .env file for Docker Compose..."
      cat <<EOF > .env
      AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}
      AWS_REGION=${AWS_REGION}
      SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET=${JWT_SECRET}
      GROQ_API_KEY=${GROQ_API_KEY}
      OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      PIXAZO_API_KEY=${PIXAZO_API_KEY}
      FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID}
      FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET}
      UNSPLASH_APP_ID=${UNSPLASH_APP_ID}
      UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY}
      UNSPLASH_SECRET_KEY=${UNSPLASH_SECRET_KEY}
      RAPIDAPI_KEY=${RAPIDAPI_KEY}
      SERPAPI_KEY=${SERPAPI_KEY}
      LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      NEXT_PUBLIC_API_URL=https://socialflow.io.vn
      EOF

      echo "[CI] Securing K8s manifests with environment variables..."
      sed -i "s|__AWS_ACCOUNT_ID__|${AWS_ACCOUNT_ID}|g" k8s/*.yaml
      sed -i "s|__AWS_REGION__|${AWS_REGION}|g" k8s/*.yaml
      sed -i "s|__POSTGRES_PASSWORD__|${SPRING_DATASOURCE_PASSWORD}|g" k8s/*.yaml
      sed -i "s|__JWT_SECRET__|${JWT_SECRET}|g" k8s/*.yaml
      sed -i "s|__RAPIDAPI_KEY__|${RAPIDAPI_KEY}|g" k8s/*.yaml
      sed -i "s|__SERPAPI_KEY__|${SERPAPI_KEY}|g" k8s/*.yaml
      sed -i "s|__FACEBOOK_CLIENT_ID__|${FACEBOOK_CLIENT_ID}|g" k8s/*.yaml
      sed -i "s|__FACEBOOK_CLIENT_SECRET__|${FACEBOOK_CLIENT_SECRET}|g" k8s/*.yaml
      sed -i "s|__LINKEDIN_CLIENT_ID__|${LINKEDIN_CLIENT_ID}|g" k8s/*.yaml
      sed -i "s|__LINKEDIN_CLIENT_SECRET__|${LINKEDIN_CLIENT_SECRET}|g" k8s/*.yaml
      sed -i "s|__WEBHOOK_VERIFY_TOKEN__|${WEBHOOK_VERIFY_TOKEN}|g" k8s/*.yaml
      sed -i "s|__GROQ_API_KEY__|${GROQ_API_KEY}|g" k8s/*.yaml
      sed -i "s|__OPENROUTER_API_KEY__|${OPENROUTER_API_KEY}|g" k8s/*.yaml
      sed -i "s|__PIXAZO_API_KEY__|${PIXAZO_API_KEY}|g" k8s/*.yaml
      sed -i "s|__UNSPLASH_APP_ID__|${UNSPLASH_APP_ID}|g" k8s/*.yaml
      sed -i "s|__UNSPLASH_ACCESS_KEY__|${UNSPLASH_ACCESS_KEY}|g" k8s/*.yaml
      sed -i "s|__UNSPLASH_SECRET_KEY__|${UNSPLASH_SECRET_KEY}|g" k8s/*.yaml
      sed -i "s|__FACEBOOK_APP_ID__|${FACEBOOK_APP_ID}|g" k8s/*.yaml

      echo "[CI] Copying files to EC2..."
      scp $SSH_OPTS -i ~/.ssh/id_rsa docker-compose.yml nginx.conf .env "$EC2_USER@$EC2_HOST:/home/ubuntu/socialflow/"
      scp $SSH_OPTS -i ~/.ssh/id_rsa -r k8s "$EC2_USER@$EC2_HOST:/tmp/socialflow-k8s"

      echo "[CI] Executing remote deployment..."
      ECR_PASS=$(aws ecr get-login-password --region $AWS_REGION)

      ssh $SSH_OPTS -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "
        set -euxo pipefail
        
        if [ \"$DEPLOY_TARGET\" = \"compose\" ]; then
            echo '===== DEPLOYING WITH DOCKER COMPOSE ====='
            # 1. Tat K3s (Neu dang chay)
            sudo systemctl stop k3s || true
            sudo systemctl disable k3s || true
            
            # 2. Deploy
            cd /home/ubuntu/socialflow
            
            # Tao SSL Certificate tu dong de Nginx hoat dong tren port 443
            mkdir -p /home/ubuntu/socialflow/certs
            if [ ! -f /home/ubuntu/socialflow/certs/cert.pem ]; then
              echo "Generating self-signed SSL certificate..."
              openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
                -keyout /home/ubuntu/socialflow/certs/key.pem \
                -out /home/ubuntu/socialflow/certs/cert.pem \
                -subj "/C=VN/ST=HCM/L=HCM/O=SocialFlow/CN=socialflow.io.vn"
            fi
            
            echo '$ECR_PASS' | docker login --username AWS --password-stdin ${ECR_REGISTRY}
            docker compose down || true
            docker compose pull
            docker compose up -d
            echo '✓ Deployment successful with Docker Compose!'
            
        else
            echo '===== DEPLOYING WITH KUBERNETES (K3S) ====='
            # 1. Tat Docker Compose (Neu dang chay)
            cd /home/ubuntu/socialflow
            docker compose down || true
            
            # 2. Bat K3s
            sudo systemctl enable k3s || true
            sudo systemctl start k3s || true
            
            # Doi K3s len
            K3S_BIN=\"/usr/local/bin/k3s\"
            echo 'Waiting for K3s initialization...'
            for i in \$(seq 1 30); do
              if sudo -n \$K3S_BIN kubectl get nodes >/dev/null 2>&1; then break; fi
              sleep 5
            done
            
            # 3. Deploy
            sudo -n \$K3S_BIN kubectl create namespace socialflow || true
            sudo -n \$K3S_BIN kubectl delete secret ecr-regcred --namespace socialflow || true
            sudo -n \$K3S_BIN kubectl create secret docker-registry ecr-regcred \
              --docker-server=${ECR_REGISTRY} \
              --docker-username=AWS \
              --docker-password='$ECR_PASS' \
              --namespace socialflow
              
            sudo -n rm -rf /opt/socialflow/k8s
            sudo -n mkdir -p /opt/socialflow
            sudo -n mv /tmp/socialflow-k8s /opt/socialflow/k8s
            
            sudo -n \$K3S_BIN kubectl apply -f /opt/socialflow/k8s/01-namespace.yaml
            for manifest in /opt/socialflow/k8s/*.yaml; do
              [ \"\$manifest\" = '/opt/socialflow/k8s/01-namespace.yaml' ] && continue
              sudo -n \$K3S_BIN kubectl apply -f \"\$manifest\"
            done
            echo '✓ Deployment successful with Kubernetes!'
        fi
      "
  environment:
    name: production
