stages:
  - deploy

default:
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client bash git
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

deploy_production:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      ssh "$EC2_USER@$EC2_HOST" '
        set -e

        if [ ! -d /home/ubuntu/SocialFlow/.git ]; then
          git clone "$REPO_SSH_URL" /home/ubuntu/SocialFlow
        fi

        cd /home/ubuntu/SocialFlow
        git fetch --all
        git reset --hard origin/main

        sudo k3s kubectl apply -f k8s/
        sudo k3s kubectl get pods -n socialflow -o wide
        sudo k3s kubectl get svc -n socialflow
      '
  environment:
    name: production
