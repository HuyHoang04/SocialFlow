stages:
  - deploy

default:
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client bash coreutils
    - test -n "$EC2_HOST"
    - test -n "$EC2_USER"
    - test -n "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - export SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6"

deploy_production:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      echo "[CI] Copying manifests to EC2..."
      timeout 180s scp $SSH_OPTS -i ~/.ssh/id_rsa -r k8s "$EC2_USER@$EC2_HOST:/tmp/socialflow-k8s"

      echo "[CI] Connecting to EC2 and deploying..."
      timeout 900s ssh $SSH_OPTS -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" '
        set -euxo pipefail

        sudo -n true

        # Copy manifests and apply directly without readiness check
        # K3s server may still be initializing, so use longer timeouts
        sudo -n rm -rf /opt/socialflow/k8s 2>/dev/null || true
        sudo -n mkdir -p /opt/socialflow
        sudo -n mv /tmp/socialflow-k8s /opt/socialflow/k8s

        # Apply manifests in phases to avoid overwhelming K3s API on small instance
        echo "Phase 1: Creating namespace..."
        for i in 1 2 3 4 5; do
          if sudo -n k3s kubectl apply --validate=false --request-timeout=300s -f /opt/socialflow/k8s/01-namespace.yaml; then
            echo "✓ Namespace created"
            break
          fi
          if [ $i -lt 5 ]; then
            echo "Retry $i/5: waiting for K3s API..."
            sleep 10
          fi
        done

        echo "Waiting for namespace to be ready..."
        sleep 5

        echo "Phase 2: Applying storage and config..."
        for manifest in /opt/socialflow/k8s/02-*.yaml /opt/socialflow/k8s/03-*.yaml /opt/socialflow/k8s/04-*.yaml /opt/socialflow/k8s/05-*.yaml; do
          sudo -n k3s kubectl apply --validate=false --request-timeout=300s -f "$manifest" || echo "Warning: $manifest failed, continuing..."
          sleep 2
        done

        echo "Waiting for storage to initialize..."
        sleep 5

        echo "Phase 3: Applying database and services..."
        for manifest in /opt/socialflow/k8s/06-*.yaml /opt/socialflow/k8s/07-*.yaml /opt/socialflow/k8s/08-*.yaml /opt/socialflow/k8s/09-*.yaml /opt/socialflow/k8s/10-*.yaml; do
          sudo -n k3s kubectl apply --validate=false --request-timeout=300s -f "$manifest" || echo "Warning: $manifest failed, continuing..."
          sleep 2
        done

        echo "Waiting for database to start..."
        sleep 10

        echo "Phase 4: Applying frontend and ingress..."
        for manifest in /opt/socialflow/k8s/11-*.yaml /opt/socialflow/k8s/12-*.yaml /opt/socialflow/k8s/13-*.yaml; do
          sudo -n k3s kubectl apply --validate=false --request-timeout=300s -f "$manifest" || echo "Warning: $manifest failed, continuing..."
          sleep 2
        done

        echo ""
        echo "Deployment status:"
        sudo -n k3s kubectl get pods -n socialflow -o wide 2>/dev/null || echo "Pods not yet visible"
        echo ""
        sudo -n k3s kubectl get svc -n socialflow 2>/dev/null || echo "Services not yet visible"
      '
  environment:
    name: production
