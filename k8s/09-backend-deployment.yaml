apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: socialflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
      - name: ecr-regcred
      containers:
      - name: backend
        # Image placeholder se duoc thay the boi CI/CD
        image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/socialflow/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: postgres-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"