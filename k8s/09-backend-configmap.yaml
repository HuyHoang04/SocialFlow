apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: socialflow
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/socialflow"
  SPRING_DATASOURCE_USERNAME: "socialflow"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SERVER_PORT: "8080"
  FRONTEND_URL: "https://socialflow.io.vn"
  BASE_URL: "https://socialflow.io.vn"
  APP_PYTHON_SERVICE_URL: "http://ai-service:5000"
  AI_SERVICE_URL: "http://ai-service:5000"
  APP_FRONTEND_URL: "https://socialflow.io.vn"
  APP_BASE_URL: "https://socialflow.io.vn"
  
  # Ghi đè các link OAuth Localhost thành Production
  OAUTH_FACEBOOK_REDIRECT_URI: "https://socialflow.io.vn/api/oauth/facebook/callback"
  OAUTH_TWITTER_REDIRECT_URI: "https://socialflow.io.vn/api/oauth/twitter/callback"
  OAUTH_LINKEDIN_REDIRECT_URI: "https://socialflow.io.vn/api/oauth/linkedin/callback"

  # ==============================
  # SECRETS (JWT, APIs, OAuth)
  # ==============================
  SPRING_DATASOURCE_PASSWORD: "__POSTGRES_PASSWORD__"
  JWT_SECRET: "__JWT_SECRET__"
  RAPIDAPI_KEY: "__RAPIDAPI_KEY__"
  SERPAPI_KEY: "__SERPAPI_KEY__"
  FACEBOOK_CLIENT_ID: "__FACEBOOK_CLIENT_ID__"
  FACEBOOK_CLIENT_SECRET: "__FACEBOOK_CLIENT_SECRET__"
  LINKEDIN_CLIENT_ID: "__LINKEDIN_CLIENT_ID__"
  LINKEDIN_CLIENT_SECRET: "__LINKEDIN_CLIENT_SECRET__"
  WEBHOOK_VERIFY_TOKEN: "__WEBHOOK_VERIFY_TOKEN__"