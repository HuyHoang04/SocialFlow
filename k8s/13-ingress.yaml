apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: socialflow-ingress
  namespace: socialflow
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - socialflow.io.vn
    - www.socialflow.io.vn
    secretName: socialflow-tls
  rules:
  - host: socialflow.io.vn
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
      - path: /actuator/
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
  - host: www.socialflow.io.vn
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
