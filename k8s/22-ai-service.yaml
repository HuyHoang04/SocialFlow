apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: socialflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
      - name: ai-service
        image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/socialflow/ai_service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DATABASE_URL
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: socialflow
spec:
  selector:
    app: ai-service
  ports:
  - port: 5000
    targetPort: 5000
