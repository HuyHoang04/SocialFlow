apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: socialflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      imagePullSecrets:
      - name: ecr-regcred
      containers:
      - name: ai-service
        image: __AWS_ACCOUNT_ID__.dkr.ecr.__AWS_REGION__.amazonaws.com/socialflow/ai_service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: ai-config
        - secretRef:
            name: postgres-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: socialflow
spec:
  selector:
    app: ai-service
  ports:
  - port: 5000
    targetPort: 5000
